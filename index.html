
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.container { padding: 1rem 0; font-family: var(--font-sans); }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 8px; }
.header-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.header-sub { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.shuffle-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); font-size: 13px; cursor: pointer; }
.shuffle-btn:hover { background: var(--color-background-secondary); }
.days-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; margin-bottom: 2rem; }
.day-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; }
.day-card.locked { border-color: #378ADD; border-width: 1.5px; }
.day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.day-name { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
.lock-badge { font-size: 11px; background: #E6F1FB; color: #185FA5; padding: 2px 8px; border-radius: var(--border-radius-md); }
.protein-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: var(--border-radius-md); margin-bottom: 8px; }
.pb-dana { background: #FAECE7; color: #993C1D; }
.pb-tavuk { background: #FAEEDA; color: #854F0B; }
.pb-balik { background: #E6F1FB; color: #185FA5; }

.side-dish { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
.cook-time { font-size: 12px; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.nutrition-note { font-size: 12px; color: #185FA5; background: #E6F1FB; border-radius: var(--border-radius-md); padding: 5px 8px; margin-bottom: 10px; line-height: 1.4; }
.adult-note { font-size: 11px; color: #993C1D; background: #FAECE7; border-radius: var(--border-radius-md); padding: 4px 8px; margin-bottom: 8px; }
.yt-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #993C1D; background: #FAECE7; border-radius: var(--border-radius-md); padding: 4px 10px; margin-bottom: 10px; text-decoration: none; }
.yt-link:hover { background: #F5C4B3; }
.card-actions { display: flex; gap: 6px; }
.card-btn { flex: 1; padding: 6px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
.card-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.section-title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; padding-top: 0.5rem; border-top: 0.5px solid var(--color-border-tertiary); }
.shopping-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.shop-cat { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1rem; }
.shop-cat-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.shop-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.shop-item:last-child { border-bottom: none; }
.shop-item input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: #378ADD; }
.shop-item label { font-size: 13px; color: var(--color-text-primary); cursor: pointer; }
.shop-item.checked label { text-decoration: line-through; color: var(--color-text-tertiary); }
</style>

<div class="container">
<h2 class="sr-only" style="position:absolute;left:-9999px">Haftalık yemek planı, tarifler ve alışveriş listesi</h2>
<div class="header">
  <div>
    <div class="header-sub">Haziran · Yaz menüsü · 3 kişi</div>
    <div class="header-title">Haftalık Yemek Planı</div>
  </div>
  <button class="shuffle-btn" onclick="shuffleAll()">
    <i class="ti ti-refresh" aria-hidden="true"></i> Karıştır
  </button>
</div>
<div class="days-grid" id="daysGrid"></div>
<div class="section-title">Alışveriş Listesi</div>
<div class="shopping-grid" id="shoppingGrid"></div>
</div>

<script>

function ytLink(query) {
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query + ' tarifi türkçe');
}

const ALL_MEALS = {

    { main: 'Dana Et Sote, Biber & Domates', side: 'Bulgur pilavı, cacık', time: '45 dk', note: 'C vitamini açısından zengin biberler, demirin emilimini artırır.', yt: 'dana et sote biber domatesli', shopping: ['Dana kuşbaşı (500g)', 'Renkli biber (3 adet)', 'Domates (2 adet)'] },

    { main: 'Bonfile, Kekik-Limon Marineli', side: 'Fırın domates, roka salatası', time: '40 dk', note: 'Limon marinasyonun hem aromasını hem besin değerini yükseltir.', yt: 'bonfile limon kekik marine tarifi', shopping: ['Dana bonfile (500g)', 'Taze kekik', 'Roka'] },
    { main: 'Biber Dolması (Dana Kıymalı)', side: 'Yoğurt, mevsim salatası', time: '60 dk', note: 'İnce bulgur eklenmesi hafif bir yaz versiyonu yaratır.', yt: 'dana kıymalı biber dolması tarifi', shopping: ['Dana kıyma (400g)', 'Dolmalık biber (6 adet)', 'Bulgur'] },
    { main: 'Sumak Soslu Dana Köfte Izgara', side: 'Bulgur tabboulesi, ayran', time: '45 dk', note: 'Sumak hem sindirime yardımcı hem yaz yemeklerine ferahlık katar.', yt: 'sumak soslu köfte ızgara tarifi', shopping: ['Dana kıyma (500g)', 'Sumak', 'Maydanoz (demet)', 'Nane'] },
    { main: 'Dana Güveç, Yaz Sebzeli', side: 'Ekmek, yeşil salata', time: '70 dk', note: 'Kabak ve domates bu mevsimde çok taze; harika bir yaz güveci.', yt: 'dana eti güveç kabak domatesli tarifi', shopping: ['Dana kuşbaşı (500g)', 'Kabak (2 adet)', 'Domates (3 adet)'], weekend: true },
  ],
  tavuk: [
    { main: 'Tavuk Sote, Biberli', side: 'Basmati pilavı, cacık', time: '35 dk', note: 'Biberli sote yüksek C vitamini içerir; bağışıklık için iyi.', yt: 'biberli tavuk sote tarifi', shopping: ['Tavuk göğsü (600g)', 'Renkli biber (2 adet)'] },
    { main: 'Izgara Tavuk, Limon-Sarımsak', side: 'Makarna (zeytinyağlı), yeşil salata', time: '30 dk', note: 'Yağsız pişirme tekniği yaz aylarında hafifliği korur.', yt: 'limon sarımsak ızgara tavuk tarifi', shopping: ['Tavuk göğsü (600g)', 'Limon (2 adet)'] },
    { main: 'Kekik-Hardal Fırın Tavuk But', side: 'Fırın patates, mevsim salatası', time: '55 dk', note: 'Hardal ve kekik marinadı ete derin bir aroma katar.', yt: 'hardal kekik fırın tavuk but tarifi', shopping: ['Tavuk but (6 adet)', 'Patates (4 adet)', 'Hardal (kavanoz)'] },
    { main: 'Tavuk Şiş, Közlenmiş Biberli', side: 'Bulgur pilavı, yoğurt', time: '40 dk', note: 'Közlenmiş biber antioksidan değeriyle yaz favorisi.', yt: 'tavuk şiş közlenmiş biberli tarifi', shopping: ['Tavuk göğsü (600g)', 'Renkli biber (3 adet)'] },
    { main: 'Zerdeçallı Tavuk Çorbası', side: 'Ekmek, yeşil salata', time: '40 dk', note: 'Zerdeçal anti-enflamatuar etkisiyle bağışıklığı destekler.', yt: 'zerdeçallı tavuk çorbası tarifi', shopping: ['Tavuk but (2 adet)', 'Zerdeçal', 'Havuç (2 adet)', 'Şehriye'] },
    { main: 'Tahin-Limon Soslu Tavuk But', side: 'Makarna, mevsim salatası', time: '45 dk', note: 'Tahin kalsiyum bakımından zengin; 17 yaşındaki için ideal.', yt: 'tahin limon soslu tavuk tarifi', shopping: ['Tavuk but (6 adet)', 'Tahin (kavanoz)', 'Limon'] },
    { main: 'Tavuk Dolması (Biberli)', side: 'Pilav, cacık', time: '60 dk', note: 'Dolma içindeki pirinç doyurucu; yanındaki cacık serinletici.', yt: 'tavuk kıymalı biber dolması tarifi', shopping: ['Tavuk kıyma (400g)', 'Dolmalık biber (6 adet)'] },
  ],
  balik: [
    { main: 'Izgara Levrek, Limon-Dereotu', side: 'Roka-domates salatası, ızgara kabak', time: '25 dk', note: 'Dereotu sindirime yardımcı; balıkla klasik bir Akdeniz eşleşmesi.', yt: 'ızgara levrek dereotlu tarifi', shopping: ['Levrek (3 adet)', 'Dereotu', 'Kabak (2 adet)', 'Roka'] },
    { main: 'Fırın Somon, Kapari Soslu', side: 'Yeşil salata, limon', time: '30 dk', note: 'Somon omega-3 bakımından en zengin balık; beyin ve kalp için.', yt: 'fırın somon kapari soslu tarifi', shopping: ['Somon fileto (600g)', 'Kapari (kavanoz)', 'Limon (2 adet)'] },
    { main: 'Kağıtta Çupra Fırında', side: 'Bol yeşil salata, maydanoz', time: '35 dk', note: 'Kağıtta pişirme hem yağ kullanmaz hem nemi korur.', yt: 'kağıtta çupra fırında tarifi', shopping: ['Çupra (3 adet)', 'Pişirme kağıdı', 'Kiraz domates'] },
    { main: 'Hamsi Tava (Mısır Unlu)', side: 'Roka salatası, limon', time: '20 dk', note: 'Hamsi en ekonomik omega-3 kaynağı; mısır unu hafiflik sağlar.', yt: 'mısır unlu hamsi tava tarifi', shopping: ['Hamsi (700g)', 'Mısır unu'] },
    { main: 'Uskumru Dolması, Zeytinyağlı', side: 'Mevsim salatası, limon', time: '50 dk', note: 'Uskumru B12 vitamini bakımından oldukça zengin bir balıktır.', yt: 'uskumru dolması zeytinyağlı tarifi', shopping: ['Uskumru (3 adet)', 'Ceviz', 'Kuru üzüm'], weekend: true },
    { main: 'Pisi Balığı Güveç, Domates-Sarımsak', side: 'Yeşil salata, ekmek', time: '40 dk', note: 'Hafif, az yağlı yaz balık yemeği; sarımsak bağışıklığı güçlendirir.', yt: 'pisi balığı güveç domates sarımsaklı tarifi', shopping: ['Pisi balığı (600g)', 'Domates (3 adet)'] },
  ],
  baklagil: [
    { main: 'Nohut Yemeği, Domatesli', side: 'Pilav, yoğurt', time: '35 dk', note: 'Nohut+pilav tam protein oluşturur; yoğurt kalsiyumu tamamlar.', yt: 'domatesli nohut yemeği tarifi', shopping: ['Haşlanmış nohut (2 kutu)', 'Domates (3 adet)'] },
    { main: 'Yeşil Mercimek Çorbası', side: 'Ekmek, yeşil salata', time: '35 dk', note: 'Yaz için hafif ama doyurucu; demir kaynağı.', yt: 'yeşil mercimek çorbası tarifi', shopping: ['Yeşil mercimek (300g)', 'Havuç (2 adet)', 'Kereviz sapı'] },
    { main: 'Zerdeçallı Nohut Köftesi', side: 'Bulgur salatası, yoğurt', time: '40 dk', note: 'Bitkisel protein + zerdeçal kombinasyonu güçlü bir besin deposu.', yt: 'zerdeçallı nohut köftesi tarifi', shopping: ['Haşlanmış nohut (2 kutu)', 'Zerdeçal', 'Kimyon'] },
    { main: 'Ayran Aşı Çorbası', side: 'Ekmek, mevsim salatası', time: '30 dk', note: 'Geleneksel yaz çorbası; ayran probiyotikleri sindirim sağlığı için.', yt: 'ayran aşı çorbası tarifi', shopping: ['Ayran (1L)', 'Pirinç (1 su bardağı)', 'Yumurta (2 adet)', 'Nane (kurutulmuş)'] },
    { main: 'Taze Fasulye, Zeytinyağlı', side: 'Pilav, yoğurt', time: '40 dk', note: 'Zeytinyağlı pişirme yaz için en hafif ve en doğru teknik.', yt: 'zeytinyağlı taze fasulye tarifi', shopping: ['Taze fasulye (500g)', 'Domates (2 adet)'] },
    { main: 'Kabak Yemeği, Yoğurtlu', side: 'Pilav, salata', time: '30 dk', note: 'Kabak yaz aylarının en hafif sebzesi; yüksek su içeriği serinletir.', yt: 'yoğurtlu kabak yemeği tarifi', shopping: ['Kabak (4 adet)', 'Yoğurt (500g)'] },
  ],
  patlican: [
    { main: 'İmam Bayıldı', side: 'Pilav, yoğurt', time: '50 dk', note: 'Yetişkinler için; 17 yaşındaki için ayrıca biber dolması yapılabilir.', yt: 'imam bayıldı tarifi', shopping: ['Patlıcan (3 adet)', 'Domates (3 adet)', 'Biber (2 adet)'], adultOnly: true },
    { main: 'Patlıcan Musakka (Yetişkin)', side: 'Pilav, yeşil salata', time: '65 dk', note: 'Dana kıymalı musakka; gençler için yanında ayrı köfte yapılabilir.', yt: 'patlıcan musakka tarifi', shopping: ['Patlıcan (3 adet)', 'Dana kıyma (300g)'], adultOnly: true, weekend: true },
  ]
};

const PATTERN = ['dana','tavuk','balik','baklagil','dana','balik','tavuk'];
let plan = [];
let locked = Array(7).fill(false);

function pickMeal(type, usedNames) {
  const pool = ALL_MEALS[type].filter(m => !usedNames.includes(m.main));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : ALL_MEALS[type][0];
}

function generatePlan() {
  const usedNames = locked.map((l, i) => l ? plan[i]?.meal?.main : null).filter(Boolean);
  const newPlan = [];
  for (let i = 0; i < 7; i++) {
    if (locked[i]) { newPlan[i] = plan[i]; continue; }
    const meal = pickMeal(PATTERN[i], usedNames);
    usedNames.push(meal.main);
    newPlan[i] = { type: PATTERN[i], meal, day: i };
  }
  plan = newPlan;
  renderDays();
  renderShopping();
}

function shuffleAll() { locked = Array(7).fill(false); generatePlan(); }
function toggleLock(i) { locked[i] = !locked[i]; renderDays(); }
function changeDay(i) {
  const used = plan.map((p, idx) => idx !== i ? p?.meal?.main : null).filter(Boolean);
  plan[i] = { type: PATTERN[i], meal: pickMeal(PATTERN[i], used), day: i };
  renderDays(); renderShopping();
}

const typeLabel = { dana:'Dana', tavuk:'Tavuk/Hindi', balik:'Balık', baklagil:'Baklagil' };
const typeClass = { dana:'pb-dana', tavuk:'pb-tavuk', balik:'pb-balik', baklagil:'pb-baklagil' };

function renderDays() {
  document.getElementById('daysGrid').innerHTML = plan.map((p, i) => {
    const m = p.meal;
    const lk = locked[i];
    return `<div class="day-card ${lk ? 'locked' : ''}">
      <div class="day-header">
        <span class="day-name">${DAYS[i]}</span>
        ${lk ? '<span class="lock-badge"><i class="ti ti-lock" style="font-size:11px"></i> Kilitli</span>' : ''}
      </div>
      <span class="protein-badge ${typeClass[p.type]}">${typeLabel[p.type]}</span>
      ${m.adultOnly ? '<div class="adult-note"><i class="ti ti-info-circle" style="font-size:11px;vertical-align:-1px"></i> Patlıcan içerir · Sadece yetişkin</div>' : ''}
      <div class="main-dish">${m.main}</div>
      <div class="side-dish"><i class="ti ti-bowl-spoon" style="font-size:12px;vertical-align:-1px;margin-right:4px" aria-hidden="true"></i>${m.side}</div>
      <div class="cook-time"><i class="ti ti-clock" style="font-size:12px" aria-hidden="true"></i>${m.time}</div>
      <div class="nutrition-note"><i class="ti ti-leaf" style="font-size:11px;vertical-align:-1px;margin-right:3px" aria-hidden="true"></i>${m.note}</div>
      <a class="yt-link" href="${ytLink(m.yt)}" target="_blank" rel="noopener">
        <i class="ti ti-brand-youtube" style="font-size:14px" aria-hidden="true"></i> YouTube'da tarif izle
      </a>
      <div class="card-actions">
        <button class="card-btn" onclick="toggleLock(${i})">
          <i class="ti ti-${lk ? 'lock-open' : 'lock'}" aria-hidden="true"></i> ${lk ? 'Kilidi Aç' : 'Kilitle'}
        </button>
        <button class="card-btn" onclick="changeDay(${i})">
          <i class="ti ti-refresh" aria-hidden="true"></i> Değiştir
        </button>
      </div>
    </div>`;
  }).join('');
}

function renderShopping() {
  const cats = { 'Et & Balık':[], 'Sebze & Meyve':[], 'Bakliyat & Kuru Gıda':[], 'Süt Ürünleri & Yumurta':[], 'Diğer':[] };
  const etK = ['Dana','Tavuk','Levrek','Somon','Çupra','Hamsi','Uskumru','Pisi'];
  const sebzeK = ['biber','domates','Domates','Patates','Kabak','Roka','Havuç','Kereviz','fasulye','Patlıcan','kiraz','Dereotu','Maydanoz','Nane','Kekik','Limon'];
  const bakK = ['nohut','mercimek','Bulgur','Şehriye','Mısır unu','Pirinç','Kimyon'];
  const sutK = ['Yoğurt','Ayran','Yumurta'];
  const allS = [...new Set(plan.flatMap(p => p.meal.shopping || []))];
  allS.forEach(item => {
    if (etK.some(k => item.startsWith(k))) cats['Et & Balık'].push(item);
    else if (sebzeK.some(k => item.includes(k))) cats['Sebze & Meyve'].push(item);
    else if (bakK.some(k => item.includes(k))) cats['Bakliyat & Kuru Gıda'].push(item);
    else if (sutK.some(k => item.includes(k))) cats['Süt Ürünleri & Yumurta'].push(item);
    else cats['Diğer'].push(item);
  });
  const icons = { 'Et & Balık':'ti-meat','Sebze & Meyve':'ti-plant','Bakliyat & Kuru Gıda':'ti-package','Süt Ürünleri & Yumurta':'ti-egg','Diğer':'ti-shopping-cart' };
  document.getElementById('shoppingGrid').innerHTML = Object.entries(cats)
    .filter(([,v]) => v.length)
    .map(([cat, items]) => `<div class="shop-cat">
      <div class="shop-cat-title"><i class="ti ${icons[cat]}" style="font-size:14px" aria-hidden="true"></i>${cat}</div>
      ${items.map((item, idx) => `<div class="shop-item" id="si${cat.replace(/\s&\s/g,'').replace(/\s/g,'')}-${idx}">
        <input type="checkbox" id="cb${cat.replace(/\s&\s/g,'').replace(/\s/g,'')}-${idx}" onchange="this.closest('.shop-item').classList.toggle('checked',this.checked)">
        <label for="cb${cat.replace(/\s&\s/g,'').replace(/\s/g,'')}-${idx}">${item}</label>
      </div>`).join('')}
    </div>`).join('');
}

generatePlan();
</script>
